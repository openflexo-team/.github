# Reference label set of the openflexo-team organisation
- name: "status:in-progress"
  color: "fbca04"
  description: "Work has started"
- name: "status:blocked"
  color: "b60205"
  description: "Waiting for something else"
- name: "status:deferred"
  color: "c5def5"
  description: "Postponed, not planned for the current release"
- name: "status:needs-info"
  color: "d4c5f9"
  description: "Cannot be worked on without more information"
- name: "repro:confirmed"
  color: "0e8a16"
  description: "Reproduced by a script or a test"
- name: "repro:not-reproduced"
  color: "e99695"
  description: "Could not be reproduced on the current branch"
- name: "repro:script"
  color: "1d76db"
  description: "A KnownDefects script or a test reproduces it"
- name: "resolved:obsolete"
  color: "cccccc"
  description: "Closed because the code concerned no longer exists"
- name: "resolved:fixed-in-3.0"
  color: "5319e7"
  description: "Fixed in release 3.0"
